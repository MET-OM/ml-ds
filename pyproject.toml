[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-ds"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "xarray[complete]",
    "netcdf4",
    "pytorch-lightning",
    "lightning[extra]",
    "notebook",
    "ipykernel",
    "torch",
    "torchvision",
]

[tool.pip]
# Extra index URL for PyTorch CUDA 13.0 wheels
extra-index-url = [
    "https://download.pytorch.org/whl/cu130"
]


# [tool.setuptools.packages.find]
# include = ["src/ml_ds"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = [
  # zip-without-explicit-strict
  "B905"
]

# Ignore `E402` (import violations) in all `__init__.py` files, and in select subdirectories.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]
